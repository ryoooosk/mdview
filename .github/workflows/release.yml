name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: create release
        # タグ名を run に直接埋め込まないのは、タグ名に含まれる文字がシェルのコマンドとして実行されないようにするため
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
